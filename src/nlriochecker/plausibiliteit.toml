# ATTR-003: materiaal past niet bij begindatum (W, Plausibiliteit).
#
# De jaartallen zijn per regel nagelopen tegen wetgeving, vaktijdschriften en
# fabrikanten (bronnenonderzoek issue #20). Vier claims uit de oude tabel zijn
# geschrapt omdat geen bron ze draagt: PE (1970), Polypropyleen (1975), GewapendBeton
# (1920 -- wapening volgt uit belasting, niet uit bouwjaar) en Metselwerk (tot 1960 --
# een verkeerd gelezen bron over betonbuizen). ATTR-003 toetst die vier materialen
# daardoor niet meer op begindatum; hoeveel strengen daardoor buiten beeld vallen meldt
# de check in haar toelichting. Een eerlijk gat is beter dan een verzonnen grens.

[[materiaal_begindatum]]
