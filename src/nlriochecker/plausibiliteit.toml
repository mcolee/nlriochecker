# Plausibiliteitstabellen voor de ATTR-checks.
#
# Deze tabellen zijn vakinhoudelijke aannames, geen harde GWSW-regels: ze zeggen
# wat je in een Nederlandse vrijvervalriolering *verwacht*, niet wat er moet. Ze
# horen daarom per project herzien te worden. De materiaalnamen zijn de korte
# GWSW-begrippen uit de domeinlijst MateriaalLeidingColl; de vormnamen die uit
# VormLeidingColl.
#
# Een materiaal dat hier niet in staat wordt niet getoetst; de betreffende check
# meldt in haar toelichting hoeveel strengen daardoor buiten beeld bleven.
#
# HERKOMST. Elke regel draagt een `bron`-veld (issue #20). Toegestaan zijn vier harde
# projectankers -- `ontologie`, `checkregister`, `RIONED Kennisbank`, `Leidraad C2100`
# -- en `ervaringsregel`. Die laatste is de eerlijke bak voor een waarde die uit geen
# van de vier volgt (een fabrikantmaattabel, een NEN-norm, wetgeving of een
# expertaanname); de specifieke bron staat dan in `toelichting`. De diameterbereiken
# per materiaal hieronder zijn stuk voor stuk zulke ervaringsregels: geen van de vier
# ankers geeft een handelsmaatreeks per buismateriaal.

bron = "Werkafspraak project nlriochecker, fase 4; te herzien per gemeente."

# ATTR-005: eenhedenfouten binnen bereik. Een breedte- of hoogtemaat die zelf geen
# handelsmaat is maar maal tien wel, is vrijwel zeker in centimeters genoteerd.
# (Deze lijst staat als losse sleutel boven de tabellen, want in TOML horen
# top-level-sleutels vóór elke [[tabel]].)
standaarddiameters_mm = [
  63, 75, 80, 90, 100, 110, 125, 150, 160, 200, 250, 300, 315, 400, 500, 600,
  700, 800, 900, 1000, 1100, 1200, 1250, 1400, 1500, 1600, 1800, 2000, 2500, 3000,
]

# ATTR-002: gangbare ondergrens van de diameter, per stelseltype (W, Plausibiliteit).
# Vervangt de ene drempel `minimale_diameter_mm`. Een gemengd of hemelwaterriool
# begint hoger dan een vuilwaterriool. Het stelseltype volgt uit de eigen GWSW-klasse
# van de streng (`[klassen.stelseltypen]`); een streng zonder herkenbaar type valt op
# `overig` terug. De harde ondergrens van 63 mm uit de GWSW-waardebereiken toetst de
# nulmeting zelf; deze tabel gaat over het gat daarboven.

