# Plausibiliteitstabellen voor de ATTR-checks.
#
# Deze tabellen zijn vakinhoudelijke aannames, geen harde GWSW-regels: ze zeggen
# wat je in een Nederlandse vrijvervalriolering *verwacht*, niet wat er moet. Ze
# horen daarom per project herzien te worden. De materiaalnamen zijn de korte
# GWSW-begrippen uit de domeinlijst MateriaalLeidingColl; de vormnamen die uit
# VormLeidingColl.
#
# Een materiaal dat hier niet in staat wordt niet getoetst; de betreffende check
# meldt in haar toelichting hoeveel strengen daardoor buiten beeld bleven.

