minimum_mm = 250
bron = "RIONED Kennisbank"
toelichting = "Kennisbank Stedelijk Water: gebruikelijke minimale diameter voor gemengde riolen is 250 mm."

[[minimale_diameter]]
stelseltype = "hemelwater"
minimum_mm = 250
bron = "RIONED Kennisbank"
toelichting = "Kennisbank Stedelijk Water: minimaal 250 mm voor hemelwaterriolen; 300 mm is gangbaar."

[[minimale_diameter]]
stelseltype = "vuilwater"
minimum_mm = 200
bron = "checkregister"
toelichting = "Checkregister (regel ATTR-002) en Kennisbank Stedelijk Water: vuilwater vrijverval vanaf 200 mm."

[[minimale_diameter]]
stelseltype = "overig"
minimum_mm = 200
bron = "ervaringsregel"
toelichting = "Vangnet voor strengen zonder herkenbaar stelseltype (infiltratie, drainage, transport, onbekend); 200 mm was de vroegere enkele ondergrens."

