# ATTR-010: leidingmateriaal beton of metselwerk terwijl het putmateriaal daar
# niet bij past (W, Plausibiliteit).
#
# `Metselwerk` blijft voorlopig staan, hoewel de collectie MateriaalPutColl hem niet
# kent (die heeft MetselwerkBaksteen, MetselwerkBepleisterd en MetselwerkOnbepleisterd).
# De Wolden schrijft `gwsw:Metselwerk` feitelijk op 33 putten; dat de export buiten de
# domeinlijst valt meldt de SHACL-nulmeting al (33 keer `MateriaalPut_ref` per CFK).
# Dit is een bewuste, tijdelijke afwijking van "GWSW is leidend" en staat als BO-35 in
# docs/beslislog.md; de vraag of deze tabel de export volgt of de domeinlijst ligt bij
# de auteur, als vraag 2 van issue #47.
#
# `Kunststof` stond hier wel en is weg: die waarde bestaat, maar in
# MateriaalAfsluiterColl, MaterialOfStepsColl en Uitvoering -- niet in
# MateriaalPutColl, dus geen enkele legale export schrijft hem op een put. Er is niets
# voor in de plaats gekomen: PVC en PE stonden hier al. Die twee dekken de kunststofrol
# maar deels, want MateriaalPutColl kent daarnaast HDPE, GVK, Polyester, Polypropyleen,
# PitchFibre en UnidentifiedTypeOfPlastics, en geen van die zes staat hieronder. Een
# export die keurig HDPE op een put schrijft krijgt dus nog steeds een ATTR-010 die er
# niet hoort te zijn. Dat gat staat als issue #43; ze toevoegen verandert gedrag en is
# een beslissing voor de auteur.

[[leiding_put_materiaal]]
leidingmateriaal = "Beton"
verwachte_putmaterialen = ["Beton", "GewapendBeton", "Metselwerk", "PVC", "PE"]

[[leiding_put_materiaal]]
leidingmateriaal = "GewapendBeton"
verwachte_putmaterialen = ["Beton", "GewapendBeton", "Metselwerk"]

[[leiding_put_materiaal]]
leidingmateriaal = "Metselwerk"
verwachte_putmaterialen = ["Metselwerk", "Beton", "GewapendBeton"]
toelichting = "Een gemetselde streng op een kunststof put is bouwhistorisch onmogelijk."

# ATTR-004: vorm versus afmetingen (F, Consistentie). Een regel zegt wat er bij
# een profielvorm over breedte en hoogte moet gelden. De aanwezigheid van beide
# maten dwingt het MDSTOP-deelmodel al af; deze tabel gaat over hun onderlinge
# verhouding, en die toetst geen van beide conformiteitsklassen.

[[vorm_afmeting]]
vorm = "Rond"
breedte_gelijk_hoogte = true
toelichting = "Bij een rond profiel zijn breedte en hoogte per definitie gelijk."

[[vorm_afmeting]]
vorm = "Eivormig"
hoogte_groter_dan_breedte = true
toelichting = "Een eiprofiel staat rechtop: de hoogte is groter dan de breedte."

[[vorm_afmeting]]
vorm = "Muil"
hoogte_kleiner_dan_breedte = true
toelichting = "Een muilprofiel is breder dan hoog."

[[vorm_afmeting]]
vorm = "Rechthoekig"
toelichting = "Rechthoekig legt geen verhouding vast; alleen beide maten zijn nodig."

[[vorm_afmeting]]
vorm = "Heul"
toelichting = "Een heulprofiel legt geen vaste verhouding vast."
