# Mensleesbare teksten bij de SHACL-vormen van de GWSW-nulmeting (issue #101).
#
# Sleutel: de naam van de geschonden SHACL-vorm, exact zoals de kolom `Source` van een
# rapport van de GWSW-server hem schrijft. Waarde: een vaste, beschrijvende Nederlandse
# zin -- wat er aan de hand is, geen handelingsadvies. De GWSW-termen blijven staan:
# "Overstortput" is de naam van het ding, en hem vervangen door een omschrijving maakt
# de melding niet leesbaarder maar wel onnauwkeurig.
#
# Deze 43 teksten zijn door de auteur vastgesteld (issue #101, comment 28-08) en worden
# niet zonder zijn besluit gewijzigd. Zie BO-74 in docs/beslislog.md.
#
# Sjabloonvelden: `{min}`, `{max}` en `{n}` worden per melding ingevuld uit de
# meldingsrij zelf -- nooit uit een hier of elders vastgelegde grens. `{min}` en `{max}`
# komen uit de grens die de kolom `Message` achteraan tussen haakjes noemt
# (`... waarde wijkt af (min=63,max=4000)`), `{n}` uit het getal waarmee de kolom
# `Value` opent. Is een veld uit de rij niet te halen, dan vervalt de haakjesgroep
# eromheen en blijft de zin zonder ingevulde grens staan. De grens gaat alleen naar
# deze zin: het meldingveld `drempel` blijft leeg, zoals docs/json-schema.md zegt.
#
# Een vorm zonder regel hieronder valt terug op de technische SHACL-tekst, en het
# rapport telt hoeveel meldingen dat waren. Vul de tabel dus aan zodra een nieuwe vorm
# opduikt -- de drifttest in tests/test_integration.py meet dat tegen de De
# Wolden-rapporten.
#
# Literale TOML-strings ('...'), zodat de aanhalingstekens in de tekst geen
# ontsnapping nodig hebben.

