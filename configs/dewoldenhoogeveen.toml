# Projectconfiguratie voor De Wolden + Hoogeveen.
#
# Sinds issue #163 (BO-98) is dit een OVERLAY op de meegeleverde standaard: `basis =
# "standaard"` laadt eerst `src/nlriochecker/checks.toml`, en alleen de sleutels hieronder
# worden eroverheen gelegd. Tabellen worden sleutel-voor-sleutel gemerged; een lijst (ook
# een tabel-array als `[[verhang_staffel]]`) vervangt als geheel. Alle drempels, klassen en
# koppelregels komen dus uit de standaard en lopen vanzelf mee; wie er een wil verleggen
# doet dat in de standaard, of overschrijft hem hier bewust.
#
# De acht sleutels die van Koekangerveld (de standaard) naar De Wolden + Hoogeveen
# verschillen -- zeven bronpaden en de onderdrukking van het mechanische riool:
#   map                  data/gis_dewoldenhoogeveen in plaats van data/gis_koekangerveld
#   bag_pand             BAG_light_pand.gpkg (58.067 panden)
#   nwb_wegvakken        NWB_wegvakken_DeWoldenHoogeveen.gpkg (9787 wegvakken)
#   top10nl              TOP10NL_plaats_vlak_DeWoldenHoogeveen.gpkg (laag plaats_vlak)
#   studiegebied         de CBS-buurtenkaart met 100 m buffer (36.708,5 ha, een feature)
#   ahn_dtm              AHN6 in plaats van AHN5
#   bgt_putdeksellagen   leeg (de BGT-laag `put` is spoorinfrastructuur; EXT-005/006 vervielen)
#   onderdruk_klassen    het mechanische riool plus de pompunit uit de uitvoer houden
#
# Gebruik:
#   uv run nlriochecker toets \
#     --dataset data/gwsw_orox_ttl/dewoldenhoogeveen_orox.ttl \
#     --shacl data/shacl_nulmeting/gwsw_shacl_report_conformiteit_Hyd.csv \
#     --shacl data/shacl_nulmeting/gwsw_shacl_report_conformiteit_MdsPlan.csv \
#     --shacl data/shacl_nulmeting/gwsw_shacl_report_MdsProj.csv \
#     --projectconfig configs/dewoldenhoogeveen.toml \
#     --bronnen data/gis_dewoldenhoogeveen \
#     --output uitvoer/dewoldenhoogeveen
#
# Zonder `--ontologie` draait die run op de GWSW-ontologie die met gwsw-orox-helpers
# meekomt; dat is de bedoelde weg.

basis = "standaard"

[bronnen]
# Blok C: de aangeleverde externe bronnen voor De Wolden + Hoogeveen. Het bereik is de
# CBS-buurtenkaart met 100 m buffer (36.709 ha); objecten daarbuiten krijgen geen
# EXT-uitslag maar de status "buiten studiegebied". De overige [bronnen]-sleutels
# (`bgt`, `dekking_tolerantie_m`, `top10nl_komlagen`, de BGT-rollen) zijn gelijk aan de
# standaard en komen daar vandaan.
map = "data/gis_dewoldenhoogeveen"
bag_pand = "BAG_light_pand.gpkg"
# EXT-009: de NWB-wegvakken (9787 stuks) en het TOP10NL-plaatsvlak met de bebouwde kom.
nwb_wegvakken = "NWB_wegvakken_DeWoldenHoogeveen.gpkg"
top10nl = "TOP10NL_plaats_vlak_DeWoldenHoogeveen.gpkg"
studiegebied = "CBS_buurten_DeWoldenHoogeveen_buffer_100m.gpkg"
ahn_dtm = "AHN6_DeWoldenHoogeveen_DTM.tif"
# De BGT-laag `put` telt hier 843 objecten, waarvan 595 van ProRail: geen putdekselbron
# maar spoorinfrastructuur. EXT-005 en EXT-006 vervielen met issue #95; de rol blijft leeg.
bgt_putdeksellagen = []

[rapport]
# Meldingen die de uitvoer niet halen (issue #65): het mechanische riool (dezelfde twee
# wortels als `[klassen] mechanisch`) plus de pompunit, de pompput van de drukriolering.
# `Pompunit` is een `Rioolput` in het mechanische stelsel (BO-55), geen vrijvervalput.
# Zie BO-49.
onderdruk_klassen = ["MechanischeRioolleiding", "MechanischeTransportleiding", "Pompunit"]
