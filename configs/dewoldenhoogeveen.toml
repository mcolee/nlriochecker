putbodem_boven_bob_m = 0.05
putbodem_zonk_m = 0.50
# HGT-017: afwijking tussen de z-waarde uit de geometrie en de administratie. Het
# checkregister noemt de check maar geen getal; projectkeuze, geen externe bron.
z_afwijking_m = 0.05

# RVZ-004: afstand tot ontvangend oppervlaktewater. Het checkregister laat de
