[netwerk]
# Hoe de afvoerrichting van een vrijvervalstreng bepaald wordt.
#   administratief - de van-naar-richting uit het GWSW-model (standaard; dat is wat
#                    het register bedoelt, en NET-009 toetst of die richting klopt)
#   bob            - afgeleid uit het bodemverloop, met terugval op de
#                    administratieve richting bij ontbrekende of gelijke BOB's
richting = "administratief"

[nulmeting]
# De conformiteitsklassen die de GWSW-server aanbiedt en die alle drie aanwezig
# moeten zijn. Ontbreekt er een, dan faalt de pijplijn.
vereiste_cfk = ["Hyd", "MdsPlan", "MdsProj"]

[inwinning]
# Hoe de inwinningsmetagegevens van deze bronexport gelezen moeten worden. De
# waarden komen uit de collectie WijzeVanInwinningColl van de GWSW-ontologie; die
# maakt geen onderscheid naar kenmerksoort, dus de betekenis is projectafspraak.
#
# Wijzen die uit een landelijk hoogtemodel komen. Een maaiveldhoogte die zo is
# ingewonnen, vergelijken HGT-001 en HGT-002 met haar eigen bron; de bevinding
# krijgt daarom een kanttekening. In De Wolden en Hoogeveen geldt dat voor 5104 van de 22363
# maaiveldhoogten: daar staat AHN2 op het Punt-aspect van de maaiveldorientatie.
# `AHN6` is de gebruikte inwinningsbron (zie `ahn_dtm` hierboven), maar bestaat nog niet
# in het GWSW (1.6 noch 1.7): WijzeVanInwinningColl stopt bij AHN4. De waarde blijft bewust
# staan als vooruitloop op een latere GWSW-versie; zo besloten in vraag 1 van issue #47 (BO-40).
uit_hoogtemodel = ["AHN", "AHN1", "AHN2", "AHN3", "AHN4", "AHN6"]
# Waarden die expliciet "onbekend" zeggen. Ze passeren elke kardinaliteits- en
# collectietoets van de nulmeting maar zijn informatief leeg; het bevindingen-
# rapport telt ze apart zodat een compleetheidscijfer niet te rooskleurig leest.
onbekend = ["NietAchterhaald"]

[vulwaarden]
# Hoogtekenmerken waarin deze bronexport 0,000 schrijft voor "niet geregistreerd".
# In De Wolden en Hoogeveen is 25% van de BOB's en 14% van de maaiveldhoogten exact 0,00 bij een
# maaiveld van 5 tot 17 m NAP. Zo'n waarde wordt na het laden als ontbrekend gelezen
# en door ATTR-013 een keer per object gemeld; de hoogtechecks slaan het object over
# en zeggen dat in hun toelichting. Een lege lijst zet de leesregel uit (laag
# Nederland: daar kan 0,00 m NAP een meting zijn).
hoogte_kenmerken = ["BobBeginpuntLeiding", "BobEindpuntLeiding", "Maaiveldhoogte", "Putdekselniveau"]
# |waarde| tot en met deze band geldt als vulwaarde; 0.01 omdat ook 0,01 voorkomt.
hoogte_band_m = 0.01

# Instellingen van het rapport en de GIS-uitvoer. Geen enkele drempel staat in de
# code; wie ze wil verleggen doet dat hier.
[rapport]
# Boven dit aandeel strengen met stijgende bodem benoemt het rapport systematisch
# omgekeerde registratie als gezamenlijke oorzaak.
richtingsdrempel = 0.10
# Vanaf hoeveel verschillende checks op hetzelfde object dat als een enkele
# vermoedelijke fout wordt gepresenteerd in plaats van als losse meldingen.
multi_melding_checks = 3
# 0 = alle bevindingen tonen. Het rapport verwijst toch al naar de CSV, maar
# afkappen zonder het te zeggen leest als "dit is alles".
max_bevindingen_per_check = 0
# Boven dit aandeel van de bekeken populatie heet een meldingtype systemisch: het
# zegt dan meer over de export als geheel dan over de losse objecten.
systemisch_drempel = 0.80
# En vanaf hoeveel bekeken objecten dat aandeel iets mag betekenen. Onder dit aantal is
# de ratio geen uitspraak over de export maar een breuk van kleine getallen: 26 van de 26
# gemengde strengen in een buurt is geen structureel verschijnsel, en de vlag zou dat
# gebrek van de kaart en uit de popup halen. Zie BO-59.
systemisch_minimum_bekeken = 100
# Versie van het checkregister waaraan deze run getoetst is.
register_versie = "v0.9"
# Meldingen die de uitvoer niet halen (issue #65): het mechanische riool (dezelfde twee
# wortels als `[klassen] mechanisch`) plus de pompunit, de pompput van de drukriolering.
# Het checkregister rekent mechanisch riool buiten scope; wat de checks (TOP-010/TOP-011,
# en op de pompunit ATTR-018) en de nulmeting er toch op melden, blijft zo uit rapport en
# kaart en wordt in de verantwoording geteld. `Pompunit` is een `Rioolput` in het
# mechanische stelsel (BO-55), geen vrijvervalput; subklassen ervan raakt de onderdrukking
# dus niet mis. Zie BO-49.
onderdruk_klassen = ["MechanischeRioolleiding", "MechanischeTransportleiding", "Pompunit"]
onderdruk_checks = []

# Hoe een analyse wordt afgebakend als er een studiegebied is opgegeven. De checks
# draaien dan op de kern (wat het gebied raakt) plus een contextschil, zodat de
# netwerkchecks hun antwoord houden; gerapporteerd wordt alleen de kern.
[studiegebied]
context_buffer_m = 50.0
volledige_dataset_checks = ["ADM-002"]
component_waarschuwingsdrempel = 0.5
