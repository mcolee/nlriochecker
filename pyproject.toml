[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlriochecker"
version = "0.1.0"
description = "Python package die helpt met het analyseren en rapporteren over (mogelijke-) fouten in GWSW-OroX (TTL) bestanden. Maakt gebruik van GWSW nulmeting maar biedt ook aanvullende checks."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "geopandas>=1.1.4",
    "networkx>=3.3",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyproj>=3.7.2",
    "rasterio>=1.5.1",
    "rdflib>=7.0",
    "shapely>=2.0",
]

[project.scripts]
nlriochecker = "nlriochecker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nlriochecker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff formatteert ook Python-codeblokken in Markdown. Deze twee documenten bevatten
# met de hand gezette fragmenten die het niet mag aanraken: bij een van beide maakt de
# voorgestelde herschikking de code aantoonbaar onjuist. Zonder deze uitsluiting zou
# `ruff format --check .` permanent rood staan en zou de poort in scripts/uitgave.py
# een andere scope moeten hanteren dan een handmatige run.
extend-exclude = [
    "docs/superpowers/plans/2026-08-16-uitvoer-ronde2.md",
    "docs/superpowers/specs/2026-08-16-gpkg-en-rapport-design.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
# De fixturegenerator bevat GML-literalen die niet af te breken zijn zonder de
# TTL-uitvoer te veranderen.
"scripts/maak_ttl_fixtures.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# De zware tests draaien niet mee in de standaardrun; met `pytest -m zwaar` wel.
addopts = "-m 'not zwaar'"
markers = [
    "integratie: draait op de volledige De Wolden-bestanden in data/",
    "zwaar: laadt de volledige OroX-dataset (ruim 3 minuten en circa 3 GB geheugen)",
    "qgis: vereist PyQGIS; overgeslagen waar qgis.core niet importeerbaar is",
]
