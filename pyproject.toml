[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlriochecker"
version = "0.3.1"
description = "Python package die helpt met het analyseren en rapporteren over (mogelijke-) fouten in GWSW-OroX (TTL) bestanden. Maakt gebruik van GWSW nulmeting maar biedt ook aanvullende checks."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # 8.2 en hoger: daarvoor mengde CliRunner stderr in stdout en bestond
    # `Result.stderr` niet, waar tests/test_cli.py op steunt.
    "click>=8.2",
    "geopandas>=1.1.4",
    # De leeslaag (dataset, graaf, geometrie, ontologie, cache, voortgang) plus de
    # gebundelde GWSW-ontologie 1.6; afgesplitst als eigen MIT-package.
    "gwsw-orox-helpers>=0.1.0",
    "networkx>=3.3",
    "pandas>=2.2",
    "pydantic>=2.7",
    # pyoxigraph levert de Rust-parser die het OroX-TTL ordegrootten sneller inleest dan
    # rdflib's pure-Python notation3 (issue #26, BO-41).
    "pyoxigraph>=0.5",
    "rasterio>=1.5.1",
    "rdflib>=7.0",
    "shapely>=2.0",
]

[project.scripts]
nlriochecker = "nlriochecker.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.uv.sources]
gwsw-orox-helpers = { git = "https://github.com/mcolee/gwsw-orox-helpers", tag = "v0.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/nlriochecker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff formatteert ook Python-codeblokken in Markdown. Deze documenten bevatten met de
# hand gezette fragmenten die het niet mag aanraken: de voorgestelde herschikking maakt
# de code aantoonbaar onjuist. Een fragment dat een paar regels uit een langere lijst
# citeert eindigt op een komma, en daar maakt de formatter een tuple van -- zo wordt
# `_Kolom("cfk_set", "text"),` tot `(_Kolom("cfk_set", "text"),)`. Zonder deze
# uitsluiting zou `ruff format --check .` permanent rood staan en zou de poort in
# scripts/uitgave.py een andere scope moeten hanteren dan een handmatige run.
#
# Ontwerpdocumenten met alleen volledige, zelfstandige codeblokken horen hier NIET in;
# die blijven meeformatteren. Zet een document hier pas bij als je hebt vastgesteld dat
# de herschikking een fragment stukmaakt.
extend-exclude = [
    "docs/superpowers/plans/2026-08-16-uitvoer-ronde2.md",
    "docs/superpowers/plans/2026-08-18-ronde1-cfk-json-voortgang.md",
    "docs/superpowers/specs/2026-08-16-gpkg-en-rapport-design.md",
    "docs/superpowers/plans/2026-08-19-bugfixes-issues-1-2-3-5-6.md",
    "docs/superpowers/plans/2026-08-24-issue-59-doorkruising.md",
    "docs/superpowers/plans/2026-08-24-issue-60-fantoomkoppeling-top022.md",
    "docs/superpowers/plans/2026-08-24-issue-61-attr018-begindatum.md",
    "docs/superpowers/plans/2026-08-24-issue-62-adm010-loze-leidingen.md",
    "docs/superpowers/plans/2026-08-24-issue-63-hgt001-drempel.md",
    "docs/superpowers/plans/2026-08-25-ci-overslagbewaking.md",
    "docs/superpowers/plans/2026-08-25-issue-65-onderdrukking.md",
    "docs/superpowers/plans/2026-08-25-issue-66-uitvoer-optie.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D"]
# D203/D213 zijn de tegenhangers van D211/D212 en kunnen niet samen aan; zonder deze twee
# waarschuwt ruff bij elke run. D400 eist een punt aan het eind van de eerste docstringregel,
# maar drie samenvattingen zijn een Nederlandse vraag ("... waar komt het water uit?",
# checks/netwerk.py; checks/topologie.py; checks/wegvakken.py) -- een punt maakt die zin fout.
# D415 blijft wel aan en eist punt, vraag- of uitroepteken; die slaagt overal al.
# D401 eist de Engelse gebiedende wijs ("Return the ...") en misvuurt per definitie op de
# verplichte Nederlandse docstrings ("True als de waarde onder het minimum valt", CLAUDE.md).
ignore = ["D203", "D213", "D400", "D401"]

[tool.ruff.lint.per-file-ignores]
# De fixturegenerator bevat GML-literalen die niet af te breken zijn zonder de
# TTL-uitvoer te veranderen.
"scripts/maak_ttl_fixtures.py" = ["E501"]
# De docstringregels gelden voor de package, niet voor de tests, de scratch-scripts en de
# harness-hook: daar zijn het er 385 en zeggen ze niets over de kwaliteit van de uitvoer.
# `ruff check .` draait over de hele repo, dus zonder deze regels staat de poort rood op
# code die geen enkel rapport haalt.
"tests/**" = ["D"]
"scripts/**" = ["D"]
".claude/**" = ["D"]

[tool.mypy]
python_version = "3.12"
files = ["src/nlriochecker"]
# rdflib, shapely, geopandas en rasterio leveren geen bruikbare stubs; zonder deze
# regel verdrinkt elke echte melding in import-fouten.
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

# Ratchet: de modules die nog niet volledig geannoteerd zijn. Deze lijst wordt alleen
# korter, nooit langer. Is hij leeg, dan kan dit blok weg (en kan `ANN` erbij in ruff --
# meet het dan opnieuw; `ANN001`/`ANN201`/`ANN202` slaan op dezelfde functies als de drie
# vlaggen hierboven, dus zolang deze lijst bestaat zou `ANN` een tweede uitzonderingslijst
# naast deze vragen).
[[tool.mypy.overrides]]
module = [
    "nlriochecker.checkconfig",
    "nlriochecker.checks.administratief",
    "nlriochecker.checks.attributen",
    "nlriochecker.checks.betrouwbaarheid",
    "nlriochecker.checks.hoogten",
    "nlriochecker.checks.meetkunde",
    "nlriochecker.checks.netwerk",
    "nlriochecker.checks.randvoorzieningen",
    "nlriochecker.checks.topologie",
    "nlriochecker.cli",
    "nlriochecker.karakteristiek",
    "nlriochecker.plausibiliteit",
    "nlriochecker.uitvoer.bevindingen",
    "nlriochecker.uitvoer.gpkg",
    "nlriochecker.uitvoer.stijlen.symbolen",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# De zware tests draaien niet mee in de standaardrun; met `pytest -m zwaar` wel.
addopts = "-m 'not zwaar'"
markers = [
    "integratie: draait op de volledige De Wolden-bestanden in data/",
    "zwaar: laadt de volledige OroX-dataset (circa anderhalve minuut en bijna 3 GB geheugen)",
    "qgis: vereist PyQGIS; overgeslagen waar qgis.core niet importeerbaar is",
]

[tool.coverage.run]
# Takdekking: op een codebase van vrijwel louter voorwaardelijke domeinlogica telt een
# `if` pas als gedekt wanneer beide takken gelopen zijn. De instelling staat hier en niet
# in de twee poortcommando's, zodat de CI, scripts/uitgave.py en een handmatige run
# dezelfde meting doen -- één vindplaats.
branch = true
