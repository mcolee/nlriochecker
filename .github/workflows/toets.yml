name: toets

on:
  push:
    branches: [main, dev]
  # Alleen pull requests naar main; een push naar dev met een open PR zou anders
  # twee runs starten voor dezelfde commit.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toets:
    runs-on: ubuntu-latest
    env:
      # Deze runner mist de niet-getrackte delen van data/ (de OroX-export, de
      # ontologieen, de GIS-bronnen) en PyQGIS; de eerste groene run gaf 673 geslaagd
      # en 33 overgeslagen bij 711 lokaal. De grens vangt dus niet dat data/ ontbreekt
      # -- dat is hier de normale toestand en haalt hem ruim -- maar wel het wegvallen
      # van meer dan die bekende overslagen, zoals een fixturemap die niet meekomt.
      # Zonder grens leest zoiets als "alles groen". Loopt de suite door, verhoog de
      # grens dan mee; hij hoort onder het CI-aantal te blijven.
      # De controle zelf staat in tests/conftest.py.
      #
      # Ronde 1 bracht de suite lokaal op 774; de nieuwe tests hangen alleen van
      # getrackte fixtures af, dus CI komt rond 736 uit. 700 houdt daar marge onder
      # en is weer een grens die bijt: met 650 zou een regressie die tachtig tests
      # laat wegvallen er ongezien doorheen zijn gekomen.
      #
      # De suite staat nu lokaal op 1312 geslaagd; 700 bijt dus niet meer. Het
      # CI-aantal is niet geschat maar gemeten in een schone `git clone` van dev
      # (die heeft `data/` niet, net als deze runner): 1139 geslaagd, 180
      # overgeslagen. Daar gaan de 10 tests van tests/test_uitvoer_qgis.py nog af --
      # de kloonmachine heeft QGIS, ubuntu-latest niet -- dus CI komt op ongeveer
      # 1129. 1070 houdt daar dezelfde marge van circa 5% onder als 700 onder 736
      # deed. Let op: 140 van de 142 gevallen van tests/test_gwsw_vocabulaire.py
      # zitten in die 180 overslagen, want de GWSW-ontologie is niet getrackt.
      NLRIOCHECKER_MIN_GESLAAGD: "1070"
    steps:
      - uses: actions/checkout@v7

      - name: uv installeren
        # setup-uv publiceert geen meebewegende major-tag meer; daarom een vast nummer.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Afhankelijkheden installeren
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (opmaak)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q
